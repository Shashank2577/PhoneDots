name: Android release

# One release: the Android APK, plus unsigned iOS (.ipa) and macOS (.zip) apps
# from apple-build.yml, built in parallel and published together.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  apple:
    uses: ./.github/workflows/apple-build.yml
    with:
      name: ${{ github.event.inputs.tag || github.ref_name }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* || true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK (arm64)
        # Signed with your release key when the ANDROID_KEYSTORE_* secrets exist,
        # else with the vendor's public test key (baseApp signing/README.md).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          flutter build apk --release --target-platform android-arm64

      - name: Name the APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "PhoneDots-$TAG-arm64.apk"
          sha256sum "PhoneDots-$TAG-arm64.apk" > "PhoneDots-$TAG-arm64.apk.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phonedots-android
          path: PhoneDots-*-arm64.apk*

  publish:
    needs: [build, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - id: apk
        run: |
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PhoneDots ${{ steps.apk.outputs.tag }}
          prerelease: true
          files: dist/*
          body: |
            **Android** (`.apk`): arm64 phones, Android 8.0+, 8 GB RAM recommended for Gemma 4 E2B.

            **iPhone** (`-ios-unsigned.ipa`, iOS 18+): not signed, so install it yourself with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) and a free Apple ID: download the .ipa on your computer, open it in Sideloadly (or AltStore), sign in with your Apple ID and install to your iPhone, then on the iPhone trust your Apple ID under Settings → General → VPN & Device Management. A free Apple ID signs for 7 days: install it again after that. Without a paid Apple Developer account the iPhone app keeps its own models (the shared App Group needs one), so it doesn't share them with other apps.

            **Mac** (`-macos.zip`, macOS 14+, Apple silicon only): unzip and move PhoneDots to Applications. It isn't notarised, so the first time right-click it → Open (or run `xattr -dr com.apple.quarantine /Applications/PhoneDots.app`).

            **Android install:** download the APK on your phone, open it and allow installs from your browser. Later builds update in place (the vendor's test signing key, shared with Burrow, so the two apps also share downloaded models).

            **Something wrong?** You → diagnostics → copy (or share the log), and paste it into your report.

            **First run:** choose "Download starter set" (about 3.6 GB over Wi-Fi). Gemma files come from Hugging Face and are SHA-256 verified.

            **Report:** what loads, what crashes, and tokens/sec from Lab → Benchmark.
