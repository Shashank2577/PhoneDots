name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2* || true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Name the APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "PhoneDots-$TAG-arm64.apk"
          sha256sum "PhoneDots-$TAG-arm64.apk" > "PhoneDots-$TAG-arm64.apk.sha256"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PhoneDots ${{ steps.apk.outputs.tag }}
          prerelease: true
          files: |
            PhoneDots-${{ steps.apk.outputs.tag }}-arm64.apk
            PhoneDots-${{ steps.apk.outputs.tag }}-arm64.apk.sha256
          body: |
            Test build for arm64 Android phones (Android 8.0+, 8 GB RAM recommended for Gemma 4 E2B).

            **Install:** download the APK on your phone, open it and allow installs from your browser. Later builds update in place (same test signing key).

            **First run:** choose "Download starter set" (about 3.6 GB over Wi-Fi). Gemma files come from Hugging Face and are SHA-256 verified.

            **Report:** what loads, what crashes, and tokens/sec from Lab → Benchmark.
