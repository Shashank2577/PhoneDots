name: phonedots
description: "PhoneDots: an AI assistant that runs entirely on your phone."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the hand-drawn look works offline (SIL Open Font License).
  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
