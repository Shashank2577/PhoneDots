name: phonedots
description: "PhoneDots: an AI assistant that runs entirely on your phone."
publish_to: 'none'
version: 0.4.1+7

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Burrow's type, bundled so it works offline (SIL Open Font License, see assets/fonts/OFL-*).
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat_regular.ttf
        - asset: assets/fonts/caveat_semibold.ttf
          weight: 600
        - asset: assets/fonts/caveat_bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito_regular.ttf
        - asset: assets/fonts/nunito_semibold.ttf
          weight: 600
    - family: ShantellSans
      fonts:
        - asset: assets/fonts/shantell_variable.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/patrickhand_regular.ttf
