name: sherpa_onnx_macos
description: >-
  Stands in for sherpa-onnx's macOS binary so the Mac app builds: its
  xcframework and LiteRT-LM's both write include/module.modulemap, which
  Xcode refuses. Neural voices are Android and iOS only; the Mac app uses
  the system voice. Remove this override when either package renames it.
version: 2.0.3
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
